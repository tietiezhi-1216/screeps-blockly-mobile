name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Version
        run: |
          echo "APP_VERSION=1.1.${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_CODE=$(( 110 + ${{ github.run_number }} ))" >> $GITHUB_ENV
      - run: npm ci
      - run: npm test
      - name: Build APK
        run: ./scripts/build-android.sh
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.p12
          KEYSTORE=release.p12 ./scripts/sign.sh screeps-blockly-v$APP_VERSION.apk
          echo "APK=screeps-blockly-v$APP_VERSION.apk" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: "${{ env.APK }}" }
      - name: Publish GitHub Release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "v$APP_VERSION" "$APK" --title "v$APP_VERSION" \
            --notes "自动构建 $GITHUB_SHA。下载 APK 安装即可；应用启动时会自动检查此处的新版本。" --latest
