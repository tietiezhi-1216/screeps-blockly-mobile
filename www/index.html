<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Screeps World</title><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="update-ui.css"></head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<div id="roomBar"><span id="rbName"></span><button id="rbSpawn" class="primary hidden" data-icon="flag"><span class="lb">选择出生点</span></button></div>
<div id="panel" class="hidden"><div class="pnHead"><div class="pnTabs"><button data-pt="room">房间</button><button data-pt="console">控制台</button><button data-pt="memory">内存</button><button data-pt="layers">图层</button><button data-pt="global">全局</button></div><button id="pnClose" data-icon="x" class="iconbtn"></button></div>
<div id="pnBody"></div>
<div id="pnConsole" class="hidden"><div class="cnFilter"><input id="cnFind" placeholder="过滤"><button data-cf="all" class="on">全部</button><button data-cf="err">错误</button><button data-cf="me">我的</button></div><div id="cnOut"></div><div class="cnIn"><input id="cnCmd" placeholder="输入 JS" autocapitalize="off" autocomplete="off" spellcheck="false"><button id="cnRun" class="primary">执行</button></div></div></div>
<nav id="bar">
  <button id="btnRun" data-icon="cloud-upload"><span class="lb">上传</span></button>
  <button id="btnCode" data-icon="puzzle"><span class="lb">代码</span></button>
  <button id="btnBuild" data-icon="hammer"><span class="lb">建造</span></button>
  <button id="btnFlag" data-icon="flag"><span class="lb">旗帜</span></button>
  <button id="btnView" data-icon="map"><span class="lb">全图</span></button>
  <button id="btnLog" data-icon="terminal-2"><span class="lb">面板</span></button>
  <button id="btnMenu" data-icon="settings"><span class="lb">设置</span></button>
</nav>
<div id="log" class="hidden"></div>
<div id="buildPick" class="hidden"><div class="bpHead"><span id="bpTitle">建造</span><button id="bpClose" data-icon="x" class="iconbtn"></button></div><div id="bpList"></div></div>
<div id="flagPick" class="hidden"><div class="bpHead"><span>旗帜</span><button id="fpClose" data-icon="x" class="iconbtn"></button></div><div class="fpRow"><img id="fpPrev" alt=""><input id="fpName" maxlength="100" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="名字"></div><div class="fpLb">主颜色</div><div id="fpC1" class="fpSw"></div><div class="fpLb">副颜色</div><div id="fpC2" class="fpSw"></div><button id="fpOk" class="primary">选择位置</button></div>
<div id="buildBar" class="hidden"><span id="bbMsg"></span><button id="bbOk" class="primary">放置</button><button id="bbCancel">退出</button></div>
<div id="wmap" class="hidden"><div class="wmHead"><b id="wmTitle">世界地图</b><span id="wmInfo"></span><button id="wmClose" data-icon="x" class="iconbtn"></button></div><canvas id="wmCanvas"></canvas>
<div class="wmBar hidden"><div id="wmSel"><b id="wmSelName"></b><span id="wmSelSt"></span><span id="wmSelInfo"></span></div><button id="wmGo" class="primary" disabled>进入房间</button></div></div>
<div id="inspect" class="hidden"><div class="insHead"><span id="insTitle"></span><button id="insClose" data-icon="x" class="iconbtn"></button></div><div id="insBody"></div></div>
<div id="editor" class="hidden">
  <div id="edTabs"><div id="catBar"></div><div id="flyHead"><button id="flyBack" data-icon="arrow-left"><span class="lb">返回</span></button><span id="flyTitle"></span></div><button id="edClose" data-icon="check" class="primary"><span class="lb">完成</span></button></div>
  <div id="blocklyDiv"><div id="edTools"><button id="edUndo" data-icon="arrow-back-up" title="撤销"></button><button id="edRedo" data-icon="arrow-forward-up" title="重做"></button><button id="edHist" data-icon="history" title="历史版本"></button><button id="edPreview" data-icon="eye" title="预览"></button><button id="edZin" data-icon="zoom-in"></button><button id="edZout" data-icon="zoom-out"></button><button id="edCenter" data-icon="focus-centered"></button><button id="edTrash" data-icon="trash"></button></div></div>
</div>
<div id="intro" class="hidden panel">
  <div class="pTitle">新手提示</div>
  <ol class="tips">
    <li>世界运行在服务器上（你的私服或官方服务器），关掉 App 也会继续运行。</li>
    <li>点「代码」，从底部分类打开积木列表，点一下或拖出积木拼出 creep 的行为。</li>
    <li>点「完成」或「上传」把代码传到服务器，下一个 tick 开始生效；「建造」「旗帜」可手动放置。</li>
    <li>单指拖动、双指缩放，点格子查看对象；「面板」里有控制台和内存。</li>
  </ol>
  <button id="introOk" class="primary" data-icon="rocket"><span class="lb">开始玩</span></button>
</div>
<div id="menu" class="hidden panel">
  <div class="pTitle">设置</div>
  <button id="mIntro" data-icon="help"><span class="lb">新手提示</span></button>
  <button id="mResetCode" data-icon="arrow-back-up"><span class="lb">恢复默认积木</span></button>
  <div id="ver" class="muted"></div>
  <button id="mClose" data-icon="x" class="ghost"><span class="lb">关闭</span></button>
</div>
<div id="start" class="shell"><div id="startVer"></div></div>
<script src="version.js"></script>
<script src="vendor/capacitor.js"></script>
<script src="icons.js"></script>
<script src="icons-shell.js"></script>
<script src="vendor/blockly_compressed.js"></script>
<script src="vendor/blocks_compressed.js"></script>
<script src="vendor/javascript_compressed.js"></script>
<script src="vendor/msg-zh.js"></script>
<script src="vendor/pixi.min.js"></script>
<script src="screeps-const.js"></script>
<script src="geo.js"></script>
<script src="spawnpick.js"></script>
<script src="screeps-api.js"></script>
<script src="online.js"></script>
<script src="obj-art.js"></script><script src="render.js"></script>
<script src="blocks.js"></script>
<script src="back-stack.js"></script>
<script src="update-ui.js"></script><script src="update.js"></script>
<script src="main.js"></script>
<script src="badges.js"></script>
<script src="shell.js"></script>
</body></html>
