<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Screeps 积木</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<div id="bar">
  <button id="btnRun">▶ 运行</button>
  <button id="btnCode">🧩 代码</button>
  <button id="btnSpeed">1x</button>
  <button id="btnLog">📜 日志</button>
  <button id="btnNet">📡 联机</button>
  <button id="btnMenu">⚙</button>
</div>
<div id="log" class="hidden"></div>
<div id="inspect" class="hidden"></div>
<div id="editor" class="hidden">
  <div id="edTabs"><button data-t="blocks" class="on">积木</button><button data-t="js">生成的 JS</button><span style="flex:1"></span><button id="edClose">✔ 完成</button></div>
  <div id="blocklyDiv"></div>
  <pre id="jsView" class="hidden"></pre>
</div>
<div id="net" class="hidden panel">
  <div id="netStatus">当前：单机</div>
  <input id="nick" placeholder="你的昵称" maxlength="16">
  <button id="nHost">🏠 开房（本机做房主）</button>
  <button id="nScan">🔍 搜索局域网房间</button>
  <div id="hosts"></div>
  <div style="display:flex;gap:6px"><input id="ip" placeholder="房主 IP，如 192.168.1.5" style="flex:1"><button id="nJoin" style="flex:0 0 auto">加入</button></div>
  <button id="nSolo">🎮 回到单机</button>
  <button id="nClose">关闭</button>
</div>
<div id="intro" class="hidden panel">
  <h3 style="margin:0;text-align:center">欢迎来到 Screeps 积木 👋</h3>
  <div>① 这是一个持续运行的开放世界。白色圆环是你的 <b>Spawn</b>，黄色菱形是 <b>能量源</b>，小圆点是你的 <b>creep</b>。</div>
  <div>② 点 <b>🧩 代码</b>，从左侧彩色分类里拖积木，拼出 creep 的行为（默认只会“生产 + 采集”）。</div>
  <div>③ 点 <b>✔ 完成</b> 应用代码，再点 <b>▶ 运行</b> 让世界动起来。可切到“生成的 JS”看真实代码。</div>
  <div>④ 单指拖动地图、双指缩放、点格子查看信息；<b>📡 联机</b> 可在同一 WiFi 下和朋友一起玩。</div>
  <button id="introOk">开始玩</button>
</div>
<div id="menu" class="hidden panel">
  <button id="mSave">💾 立即保存</button>
  <button id="mReset">🌍 重置世界</button>
  <button id="mResetCode">🧩 恢复默认积木</button>
  <button id="mIntro">❓ 新手提示</button>
  <button id="mUpdate">⬆ 检查更新</button>
  <div id="ver"></div>
  <button id="mClose">关闭</button>
</div>
<script src="version.js"></script>
<script src="vendor/capacitor.js"></script>
<script src="vendor/blockly_compressed.js"></script>
<script src="vendor/blocks_compressed.js"></script>
<script src="vendor/javascript_compressed.js"></script>
<script src="vendor/msg-zh.js"></script>
<script src="vendor/pixi.min.js"></script>
<script src="worldgen.js"></script>
<script src="engine.js"></script>
<script src="render.js"></script>
<script src="blocks.js"></script>
<script src="net.js"></script>
<script src="update.js"></script>
<script src="main.js"></script>
</body></html>
